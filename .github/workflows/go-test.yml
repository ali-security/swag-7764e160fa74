name: go test

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional go test -run regex; empty runs the full suite'
        required: false
        default: ''

jobs:
  module-matrix:
    name: Go module matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      modules: ${{ steps.modules.outputs.modules }}

    steps:
      - uses: actions/checkout@v5
      - name: Find go modules
        id: modules
        shell: bash
        run: |
          # This script finds all go modules declared in this repo and resolves to a relative path to each of those.
          #
          # NOTES:
          #
          # > * git bash on a windows runner should support GNU find. find flags should be supported by find on macos.
          # > * We don't attempt any tricks with the go work command. Perhaps this will be the official way in future go releases.
          # > * There is no simple way to get the expected result with go list, unless all submodules are dependencies of the
          #     root module (which is not a requirement).
          set -euxo pipefail

          root="$(git rev-parse --show-toplevel)"
          cd "${root}"

          declare -i index=0
          declare -a all_mods
          printf "modules=[" >> "$GITHUB_OUTPUT"
          while read module_location ; do
            if [ $index -gt 0 ] ; then
              printf "," >> "$GITHUB_OUTPUT"
            fi
            relative_location=${module_location#"$root"/}
            module_dir=${relative_location%"/go.mod"}
            base_dir="${module_dir#"./"}"
            printf " \"${base_dir}\"" >> "$GITHUB_OUTPUT"
            all_mods+=("${base_dir}")
            index+=1
          done < <(find . -name \*.mod | grep -v "\.git" | sort | uniq)
          printf "]" >> "$GITHUB_OUTPUT"

          echo "::notice title=Modules found::${all_mods[@]}"

  module-lint:
    name: Go module lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ module-matrix ]
    if: false

    strategy:
      matrix:
        # all sub modules in this repo must be linted separately
        module: ${{ fromJSON(needs.module-matrix.outputs.modules) }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          only-new-issues: true
          skip-cache: true
          working-directory: '${{ matrix.module }}'

  lint:
    needs: [ module-lint ]
    if: false
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Linting complete
        run: |
          echo "All modules linted"

  module-test:
    name: Unit tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [ module-matrix ]

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go_version: ['oldstable', 'stable' ]
        module: ${{ fromJSON(needs.module-matrix.outputs.modules) }}

    steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '${{ matrix.go_version }}'
        check-latest: true
        cache: true

    - uses: actions/checkout@v5
    - name: Run unit tests on a single module in this repo
      shell: bash
      working-directory: '${{ matrix.module }}'
      env:
        # *.coverage.* pattern is automatically detected by codecov
        COVER_PROFILE: "${{ matrix.module }}.coverage.${{ matrix.os }}.${{ matrix.go_version }}.out"
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          go test -v -race -coverprofile="${COVER_PROFILE}" -covermode=atomic -coverpkg=$(go list)/... -run '${{ inputs.test-filter }}' ./...
        else
          go test -v -race -coverprofile="${COVER_PROFILE}" -covermode=atomic -coverpkg=$(go list)/... ./...
        fi

  test:
    needs: [ module-test ]
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tests complete
        run: |
          echo "All tests completed"

  module-zip:
    name: Build jsonutils module zip
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build module zip with golang.org/x/mod/zip
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/helper /tmp/zipsrc /tmp/out
          cd /tmp/helper
          go mod init helper
          go get golang.org/x/mod@v0.24.0
          cat > main.go <<'EOF'
          package main

          import (
            "os"

            "golang.org/x/mod/module"
            "golang.org/x/mod/zip"
          )

          func main() {
            f, err := os.Create(os.Args[4])
            if err != nil {
              panic(err)
            }
            defer f.Close()
            if err := zip.CreateFromDir(f, module.Version{Path: os.Args[1], Version: os.Args[2]}, os.Args[3]); err != nil {
              panic(err)
            }
          }
          EOF
          tar -c --exclude=.git --exclude=.github --exclude=.gitignore -C "$GITHUB_WORKSPACE/jsonutils" . | tar -x -C /tmp/zipsrc
          cp "$GITHUB_WORKSPACE/LICENSE" /tmp/zipsrc/LICENSE
          test -f /tmp/zipsrc/go.mod
          go run . github.com/go-openapi/swag/jsonutils v0.24.0 /tmp/zipsrc /tmp/out/v0.24.0.zip
          unzip -Z1 /tmp/out/v0.24.0.zip
          test "$(unzip -Z1 /tmp/out/v0.24.0.zip | wc -l)" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: /tmp/out/v0.24.0.zip
          if-no-files-found: error
